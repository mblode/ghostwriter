name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci

      - name: Install Agent Skills validator
        run: python -m pip install --disable-pip-version-check skills-ref

      - name: Validate skills
        run: |
          agentskills validate skills/ghostwriter
          agentskills validate skills/train-ghostwriter
          agentskills validate skills/evaluate-ghostwriter

      - name: Test
        run: npm test

      - name: Reject likely secrets in tracked files
        shell: bash
        run: |
          if git grep -En 'AKIA[0-9A-Z]{16}|sk-(proj-)?[A-Za-z0-9_-]{20,}'; then
            echo "A tracked file looks like it contains a credential."
            exit 1
          fi
