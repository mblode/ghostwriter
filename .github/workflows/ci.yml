name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Agent Skills validator
        run: python -m pip install --disable-pip-version-check skills-ref

      - name: Validate the skill
        run: agentskills validate skills/ghostwriter

      - name: Every reference is linked from SKILL.md
        shell: bash
        run: |
          status=0
          for f in skills/ghostwriter/references/*.md skills/ghostwriter/evals/*.json; do
            rel=${f#skills/ghostwriter/}
            grep -Fq "$rel" skills/ghostwriter/SKILL.md || { echo "SKILL.md does not link $rel"; status=1; }
          done
          exit $status

      - name: No em dashes or local machine paths in Markdown
        shell: bash
        run: |
          if grep -rn --include='*.md' -e $'—' -e '/Users/' .; then
            echo "Markdown contains an em dash or a local absolute path."
            exit 1
          fi

      - name: Reject likely secrets in tracked files
        shell: bash
        run: |
          if git grep -En 'AKIA[0-9A-Z]{16}|sk-(proj-)?[A-Za-z0-9_-]{20,}'; then
            echo "A tracked file looks like it contains a credential."
            exit 1
          fi
